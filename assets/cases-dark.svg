<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="838" viewBox="0 0 1280 838" role="img" aria-labelledby="title description">
  <title id="title">4 of 9 caught by tools</title>
  <desc id="description">Nu and axe measured. Coverage counts cases with Nu errors or measured axe violations in their before example. Each axe case shows its highest measured impact. Cases without a tool rely on the decision ladder and manual checks.</desc>
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>
  <rect width="1280" height="838" fill="#211f1a"/>
  <text x="48" y="100" font-size="60" fill="#f2ead5">4 of 9 caught by tools</text>
  <text class="mono" x="48" y="151" font-size="28" fill="#c2b79e">Nu and axe measured</text>
  <path d="M48 175 H1232" stroke="#605746" stroke-width="2"/>
  <g transform="translate(48 200)">
    <title>Use a button for an action</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">div button</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">no tool: the ladder</text>
  </g>
  <g transform="translate(451 200)">
    <title>Use a link for navigation</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">button link</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">no tool: the ladder</text>
  </g>
  <g transform="translate(854 200)">
    <title>Use dialog for a modal task</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">custom modal</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">no tool: the ladder</text>
  </g>
  <g transform="translate(48 399)">
    <title>Use details for a disclosure</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">custom disclosure</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">no tool: the ladder</text>
  </g>
  <g transform="translate(451 399)">
    <title>Associate a label with its control</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">input label</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">axe</text>
    <text class="mono" x="22" y="149" font-size="24" fill="#c2b79e">axe: critical</text>
  </g>
  <g transform="translate(854 399)">
    <title>Keep heading levels in order</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">heading order</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">Nu + axe</text>
    <text class="mono" x="22" y="149" font-size="24" fill="#c2b79e">axe: moderate</text>
  </g>
  <g transform="translate(48 598)">
    <title>Provide an image text alternative</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">image alt</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">Nu + axe</text>
    <text class="mono" x="22" y="149" font-size="24" fill="#c2b79e">axe: critical</text>
  </g>
  <g transform="translate(451 598)">
    <title>Follow document order for focus</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">positive tabindex</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">axe</text>
    <text class="mono" x="22" y="149" font-size="24" fill="#c2b79e">axe: serious</text>
  </g>
  <g transform="translate(854 598)">
    <title>Represent a list with ul and li</title>
    <rect width="378" height="175" fill="#2c2922" stroke="#605746"/>
    <text x="22" y="53" font-size="34" fill="#f2ead5">div list</text>
    <path d="M22 72 H356" stroke="#605746"/>
    <text class="mono" x="22" y="111" font-size="28" fill="#e6ab82">no tool: the ladder</text>
  </g>
</svg>
