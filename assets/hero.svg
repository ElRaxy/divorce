<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">divorce — let the browser keep the buttons</title>
  <desc id="desc">Validators catch 4 of these 9. The other 5 look fine to every tool. A div with a click handler is valid HTML but skipped by Tab and has no button role. A native button is reached by Tab and has the button role. Counts follow the example manifest: Nu measured; axe expected, not run.</desc>
  <rect width="1280" height="640" fill="#F3EDDF"/>
  <rect x="18" y="18" width="1244" height="604" fill="none" stroke="#9D9482"/>
  <path d="M40 184H1240" stroke="#9D9482"/>
  <g fill="#292923" font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="155" font-size="144" letter-spacing="-7">divorce</text>
    <text x="64" y="242" font-size="42">Validators catch 4 of these 9.</text>
    <text x="64" y="293" font-size="42">The other 5 look fine to every tool.</text>
  </g>
  <g transform="rotate(-7 1062 106)" stroke="#8E3E30" fill="none">
    <rect x="920" y="53" width="284" height="106" stroke-width="3"/>
    <rect x="927" y="60" width="270" height="92"/>
    <text x="1062" y="96" fill="#8E3E30" stroke="none" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold" letter-spacing="2">DIV SOUP</text>
    <text x="1062" y="132" fill="#8E3E30" stroke="none" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" letter-spacing="2">DISMISSED</text>
  </g>
  <rect x="56" y="330" width="570" height="244" rx="3" fill="#FBF7EF" stroke="#9D9482"/>
  <rect x="654" y="330" width="570" height="244" rx="3" fill="#FBF7EF" stroke="#9D9482"/>
  <path d="M56 330H626" stroke="#8E3E30" stroke-width="4"/>
  <path d="M654 330H1224" stroke="#2D624B" stroke-width="4"/>
  <g font-family="'Courier New', Courier, monospace" font-size="28" fill="#292923">
    <text x="80" y="373" fill="#8E3E30" font-weight="bold">BEFORE</text>
    <text x="678" y="373" fill="#2D624B" font-weight="bold">AFTER</text>
    <text xml:space="preserve" x="80" y="420"><tspan x="80">&lt;div class="btn"</tspan><tspan x="80" dy="36"> onclick="save()"&gt;Save&lt;/div&gt;</tspan></text>
    <text x="678" y="420"><tspan x="678">&lt;button type="button"&gt;</tspan><tspan x="678" dy="36">Save&lt;/button&gt;</tspan></text>
    <text x="80" y="508" font-size="28">Tab: skipped · role: none</text>
    <text x="80" y="546" font-size="28">Nu HTML Checker: valid</text>
    <text x="678" y="508" font-size="28">Tab: reaches it · role: button</text>
  </g>
  <text x="64" y="608" fill="#645C4D" font-family="'Courier New', Courier, monospace" font-size="22">Nu measured · axe expected, not run</text>
</svg>
