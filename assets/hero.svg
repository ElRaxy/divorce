<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">In the matter of div v. the spec: heading-order</title>
  <desc id="desc">Nu HTML Checker evidence. Before: examples/heading-order/before.html, error at line 10, column 6. The heading “h3” (with computed level 3) follows the heading “h1” (with computed level 1), skipping 1 heading level. Verdict fail, exit=1. After: examples/heading-order/after.html, errors 0, verdict pass, exit=0. This exhibit covers HTML only.</desc>
