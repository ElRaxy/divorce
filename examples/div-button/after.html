<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Use a button for an action</title>
</head>
<body>
<main>
  <h1>Save a draft</h1>
  <button type="button" onclick="document.getElementById('result').textContent = 'Saved'">Save</button>
  <output id="result"></output>
</main>
</body>
</html>
