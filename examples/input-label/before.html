<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Associate a label with its control</title>
</head>
<body>
<main>
  <h1>Join the mailing list</h1>
  <form>
    <p>Email address</p>
    <input id="email" name="email" type="email" autocomplete="email">
    <button>Join</button>
  </form>
</main>
</body>
</html>
