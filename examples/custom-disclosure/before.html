<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Use details for a disclosure</title>
</head>
<body>
<main>
  <h1>Delivery questions</h1>
  <div onclick="document.getElementById('answer').hidden = !document.getElementById('answer').hidden">When will my order arrive?</div>
  <p id="answer" hidden>Delivery takes three working days.</p>
</main>
</body>
</html>
